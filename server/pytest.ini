[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    unit: marks tests as unit tests
    crowdsec_live: requires a real running CrowdSec container (see
        infra/security/crowdsec/docker-compose.yml) reachable at
        CROWDSEC_LAPI_URL/CROWDSEC_API_KEY — self-skips when not configured/
        reachable, so a plain `pytest` run needs no Docker (A-11)
    osquery_live: requires a real `osqueryi` binary on PATH (see
        infra/security/osquery/README.md) — self-skips when not installed,
        so a plain `pytest` run needs no osquery install (A-15)
    clamav_live: requires a real running clamd container (see
        infra/security/clamav/docker-compose.yml) reachable at
        CLAMAV_HOST/CLAMAV_PORT — self-skips when not configured/reachable,
        so a plain `pytest` run needs no Docker (A-17)
    wazuh_live: requires a real running Wazuh Manager container (see
        infra/security/wazuh/docker-compose.yml) reachable at
        WAZUH_API_URL/WAZUH_API_USERNAME/WAZUH_API_PASSWORD — self-skips
        when not configured/reachable, so a plain `pytest` run needs no
        Docker (A-16)
