<!--
A-16: custom Wazuh manager configuration, mounted over the image's own
/var/ossec/etc/ossec.conf (see ../docker-compose.yml's header comment for
the WAZUH_CONFIG_MOUNT mechanism — confirmed live to be re-applied on every
container start, so this file is always the source of truth, never drifts).

Based on the official wazuh-docker single-node reference config
(wazuh_manager.conf), trimmed to what this manager-only, self-monitoring-
only deployment (see ../docker-compose.yml's Decision #1) actually needs:
  - <indexer>/<vulnerability-detection> explicitly disabled — no indexer
    exists in this deployment (Decision #1), so leaving these pointed at
    the reference config's unreachable "wazuh.indexer:9200" would just
    generate endless connection-retry log noise, confirmed live.
  - <syscheck><directories> replaced entirely: NOT the stock
    /etc,/usr/bin,/usr/sbin,/bin,/sbin,/boot (this container's own OS
    paths — irrelevant, nobody is attacking this manager container's own
    Amazon Linux base), but the two host-safety-scoped mounts from
    ../docker-compose.yml's Decision #2 (/monitored/data,
    /monitored/logs). realtime="yes" so FIM detects a change within
    seconds, not on the next periodic scan.
  - The stock ".log$" ignore rule is REMOVED (see the <syscheck> block
    below) — this deployment's whole point is watching REPO_ROOT/logs, so
    keeping that rule would blind it to the one file that matters most
    there (logs/assistant.log, A-5's own audit trail).
  - <auth> (agent enrollment) is left enabled at its stock default even
    though this deployment never uses it (see Decision #1) — harmless
    unused capability, kept only because removing it entirely was not
    empirically verified safe within this task's time budget; the
    enrollment ports (1515 etc.) are never published in
    ../docker-compose.yml regardless, so nothing external can reach it.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- No indexer in this deployment (Decision #1 in
       ../docker-compose.yml) -- explicitly off rather than left pointing
       at an unreachable host. -->
  <indexer>
    <enabled>no</enabled>
  </indexer>

  <!-- Requires the indexer to be useful (see <indexer> above) and would
       otherwise phone home for a CVE feed on a "local by default" product
       -- explicitly off, same opt-in reasoning as freshclam in
       infra/security/clamav/docker-compose.yml. -->
  <vulnerability-detection>
    <enabled>no</enabled>
  </vulnerability-detection>

  <!-- File integrity monitoring -- A-16's actual deliverable. Scope is
       deliberately narrow: ONLY the two read-only mount points
       ../docker-compose.yml maps to REPO_ROOT/data and REPO_ROOT/logs
       (Decision #2 there) -- never the container's own OS paths (/etc,
       /usr/bin, ... -- the image's stock default) and never any other
       host path. realtime="yes" so a live test doesn't have to wait for
       <frequency>'s periodic scan; report_changes="yes" so a modified
       (not just added/removed) file's diff is tracked too. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <directories realtime="yes" report_changes="yes" check_all="yes">/monitored/data</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/monitored/logs</directories>

    <!-- Deliberately NOT the image's stock ".log$" ignore rule -- see this
         file's header comment for why. Only .swp (editor swap-file churn,
         not a real event) stays ignored. -->
    <ignore type="sregex">.swp$</ignore>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>100</max_eps>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_interval>1h</max_interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <global>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
  </global>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>aa093264ef885029653eea20dfcf51ae</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
        <node>wazuh.manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>

</ossec_config>
